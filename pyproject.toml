[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "episcore"
version = "0.1.0"
description = "Measure corpus redundancy and operator spread in video training data"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = [
    "corpus-redundancy",
    "operator-spread",
    "marginal-novelty",
    "dataset-curation",
    "training-data",
    "embodied-ai",
    "deduplication",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# torch/torchvision are intentionally absent. They must come from the CUDA
# index rather than PyPI, and the correct build depends on the user's GPU:
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu118
dependencies = [
    "open-clip-torch",
    "huggingface-hub",
    "av>=18",
    "faiss-cpu>=1.15",
    "webdataset>=1.0",
    "numpy>=2",
    "pandas>=2",
    "pyarrow",
    "pillow>=10",
    "scikit-learn>=1.5",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
episcore = "score:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "config", "shards", "frames", "embed", "dedup",
    "local_source", "score", "validate", "run_embed", "run_report",
    "sensitivity", "separability", "confidence", "marginal_novelty",
    "subset_source", "merge_runs", "pipeline", "extract_pairs",
    "factory_stability", "check_page",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
